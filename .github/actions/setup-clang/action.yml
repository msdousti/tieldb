name: Set up clang 22
description: Installs the build dependencies (including psql, for the client test) and any extra packages. Clang 22 comes with the runner image, from the Ubuntu archive, and is listed so that apt installs it if the image ever drops it

inputs:
  packages:
    description: Extra apt packages to install
    default: ""

runs:
  using: composite
  steps:
    - name: Install clang 22 and the build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends meson ninja-build clang-22 libclang-rt-22-dev libcmocka-dev pkg-config postgresql-client ${{ inputs.packages }}
