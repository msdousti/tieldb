name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format-22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        run: |
          clang-format-22 --version
          # Check if any files would be reformatted
          FILES=$(find src tests -type f \( -name '*.c' -o -name '*.h' \))
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs clang-format-22 --dry-run --Werror
          fi

  lint:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build clang-22 clang-tidy-22 \
            libcmocka-dev pkg-config
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-22 100

      - name: Setup build
        run: meson setup build -Db_sanitize=address,undefined

      - name: Compile (needed for clang-tidy)
        run: ninja -C build

      - name: Run clang-tidy
        run: |
          clang-tidy --version
          find src -name '*.c' -print0 | xargs -0 -n1 clang-tidy -p build

  build-asan:
    name: Build (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build clang \
            libcmocka-dev pkg-config

      - name: Setup
        run: meson setup build-asan -Db_sanitize=address,undefined

      - name: Build
        run: ninja -C build-asan

      - name: Test
        run: meson test -C build-asan -v

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-asan
          path: build-asan/meson-logs/

  build-tsan:
    name: Build (TSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build clang \
            libcmocka-dev pkg-config

      - name: Setup
        run: meson setup build-tsan -Db_sanitize=thread

      - name: Build
        run: ninja -C build-tsan

      - name: Test
        run: meson test -C build-tsan -v

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-tsan
          path: build-tsan/meson-logs/

  build-release:
    name: Build (Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build clang \
            libcmocka-dev pkg-config

      - name: Setup
        run: meson setup build-release --buildtype=release

      - name: Build
        run: ninja -C build-release

      - name: Test
        run: meson test -C build-release -v

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-release
          path: build-release/meson-logs/
