name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether anything besides docs changed
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/has-code-changes.sh "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  format-check:
    name: Format Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format-22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        run: |
          clang-format-22 --version
          # Check if any files would be reformatted
          FILES=$(find src tests -type f \( -name '*.c' -o -name '*.h' \))
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs clang-format-22 --dry-run --Werror
          fi

  lint:
    name: Static Analysis (clang-tidy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-clang
        with:
          packages: clang-tidy-22

      - name: Setup build
        run: meson setup build --native-file clang.ini -Db_sanitize=address,undefined

      - name: Compile (needed for clang-tidy)
        run: ninja -C build

      - name: Run clang-tidy
        run: |
          clang-tidy-22 --version
          find src tests -name '*.c' -print0 | xargs -0 -n1 clang-tidy-22 -p build

  build-asan:
    name: Build (ASan + UBSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-clang

      - name: Setup
        run: meson setup build-asan --native-file clang.ini -Db_sanitize=address,undefined

      - name: Build
        run: ninja -C build-asan

      - name: Test
        run: meson test -C build-asan -v

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-asan
          path: build-asan/meson-logs/

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-clang
        with:
          packages: gcovr llvm-22

      - name: Test with coverage (fails below gcovr.cfg threshold)
        run: ./scripts/coverage.sh

  build-tsan:
    name: Build (TSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-clang

      - name: Setup
        run: meson setup build-tsan --native-file clang.ini -Db_sanitize=thread

      - name: Build
        run: ninja -C build-tsan

      - name: Test
        run: meson test -C build-tsan -v

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-tsan
          path: build-tsan/meson-logs/

  build-release:
    name: Build (Release)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-clang

      - name: Setup
        run: meson setup build-release --native-file clang.ini --buildtype=release

      - name: Build
        run: ninja -C build-release

      - name: Test
        run: meson test -C build-release -v

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-release
          path: build-release/meson-logs/
